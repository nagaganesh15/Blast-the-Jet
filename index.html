<html>
    <head>
        <title>anew</title>
        <style>
            body{
                padding-top: 100px;
            }
            .bu{
                width: 150px;
                height: 150px;
            }
            
        </style>
    </head>
    <body>
        <center>
            <input type="button" id="b1" class="bu" onclick="but('b1')" />
            <input type="button" id="b2" class="bu" onclick="but('b2')"/>
            <input type="button" id="b3" class="bu" onclick="but('b3')"/>
            <br>
            <input type="button" id="b4" class="bu" onclick="but('b4')"/>
            <input type="button" id="b5" class="bu" onclick="but('b5')"/>
            <input type="button" id="b6" class="bu" onclick="but('b6')"/>
            <br>
            <input type="button" id="b7" class="bu" onclick="but('b7')"/>
            <input type="button" id="b8" class="bu" onclick="but('b8')"/>
            <input type="button" id="b9" class="bu" onclick="but('b9')"/>
            <br>
            <input type="text" id="score"/>
        </center>
    </body>
    <script>
        // let a=["1."]
        function loop()
        {
            setTimeout(()=>{
                r=Math.floor(Math.random()*9);
                str='b'+String(r)
                document.getElementById(str).style.backgroundImage="url(1.png)";
                document.getElementById(str).style.backgroundPosition="center";
                document.getElementById(str).value=1;
            },500);
            setTimeout(()=>{
                document.getElementById(str).style.backgroundImage="";
                document.getElementById(str).value=0;

            },1500);
            setTimeout(loop,1500);
        }
        loop();
        function red()
        {
            setTimeout(()=>{
            r=Math.floor(Math.random()*9);
            str='b'+String(r)
            document.getElementById(str).style.backgroundImage="url(2.png)";
            document.getElementById(str).value=2;
            },1111);
            setTimeout(()=>{
                document.getElementById(str).style.backgroundImage="";
                document.getElementById(str).value=0;

            },2222);
            setTimeout(red,2222);
        }
        setTimeout(()=>{
            red();
        },300)
        
        let s=0;
        function but(x)
        {
            a=document.getElementById(x).value;
            if(a==1){
                s+=1;
                document.getElementById('score').value=s;
                document.getElementById(x).backgroundColor="";
                document.getElementById(str).value=0;
            }
        }
        
        
    </script>
</html>
