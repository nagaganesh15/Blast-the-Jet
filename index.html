<html>
    <head>
        <title>qwert</title>
        <style>
            body{
                background-image: url('sky.jpg');
                /* background-size: 100% 100% ; */
                /* background-color: blue; */
            }

        </style>
    </head>
    <body>
        <!-- <marquee direction="right" scrollamount="20" id="top" loop="1">
            <img src="bg.png" onclick="blast()"/>
        </marquee> -->
        <h1 id="h"></h1>
        <div id="marqu">

        </div>
        <script>
            let c=0;
            function loop(){
                t=Math.floor(Math.random()*85);

                // arr=['india jet.png','china jet.png','canada jet.png','pak jet.png','blue jet.png'];
                arr=["url('india jet.png')","url('china jet.png')","url('canada jet.png')","url('pak jet.png')","url('blue jet.png')"];
                ran=Math.floor(Math.random()*5);
                const marqu=document.getElementById('marqu');
                const im=document.createElement('button');
                const mar=document.createElement('marquee');
                mar.direction="right";
                im.style.width='250px';
                im.style.height="200px";
                mar.loop="1";
                im.style.backgroundImage=arr[ran];
                im.style.backgroundColor="transparent";
                im.style.border="0px";
                im.style.backgroundSize='100% 100%';
                // im.src = arr[ran];
                // im.onclick=blast(im);
                im.onclick = () => blast(im);

                mar.scrollAmount="25";
                mar.style.position="absolute";
                mar.style.top=t+'%';
                // im.id="imgid"+c;
                // const d='imgid'+c;
                // im.style.marginTop = t+'%';
                // im.style.position="relative";
                c+=1;
                marqu.appendChild(mar);
                mar.appendChild(im);
                // document.getElementById(d).style.marginTop=t+'%';
            }
            function blast(sed){
                sed.style.backgroundImage="url('blast jet.gif')";
                setTimeout(() => {
                    sed.style.backgroundImage = "none"; 
                }, 500);
                // sed.src="three.png";
            }
            loop();
            setInterval(loop,1500)
        </script>
    </body>
</html>
